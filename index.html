
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REAL LIFE | Character Creator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101319;color:white;
 font-family:Arial,sans-serif;overflow:hidden
}
#app{height:100dvh;display:flex;flex-direction:column}
header{
 padding:17px 20px;background:#171c25;
 display:flex;justify-content:space-between;
 align-items:center;border-bottom:1px solid #343b47
}
.logo{font-size:22px;font-weight:900;letter-spacing:2px}
.logo span{color:#e2a43b}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.preview{
 position:relative;background:linear-gradient(#283746,#101820);
 overflow:hidden;display:flex;align-items:center;justify-content:center
}
#scene{position:absolute;inset:0}
.preview-label{
 position:absolute;top:18px;left:18px;
 background:#101820bb;padding:10px 14px;border-radius:7px;
 font-size:12px;letter-spacing:1px;z-index:2
}
.panel{
 background:#171c25;padding:22px;
 overflow-y:auto
}
h2{font-size:23px;margin:5px 0 8px}
.sub{color:#929ba9;font-size:13px;margin-bottom:22px}
.section{margin:20px 0}
.label{
 font-size:12px;color:#aeb8c6;
 letter-spacing:1px;margin-bottom:11px
}
.choices{display:flex;gap:10px}
.choice{
 flex:1;padding:14px 8px;
 background:#242c38;border:1px solid #424d5d;
 border-radius:8px;color:white;font-size:14px;
 cursor:pointer
}
.choice.active{
 border:2px solid #dca23c;
 background:#3a3021
}
input,select{
 width:100%;padding:14px;
 background:#242c38;color:white;
 border:1px solid #424d5d;border-radius:7px;
 font-size:15px;outline:none
}
.start{
 width:100%;padding:16px;margin-top:22px;
 border:0;border-radius:7px;
 background:#d49b36;color:#151515;
 font-size:15px;font-weight:bold;cursor:pointer
}
#game{display:none;position:absolute;inset:0;background:#111}
#game canvas{width:100%;height:100%;display:block}
#gameinfo{
 position:absolute;top:12px;left:12px;
 background:#111b;padding:12px;border-radius:8px
}
#controls{
 position:absolute;bottom:20px;left:15px;right:15px;
 display:flex;justify-content:space-between
}
.pad{display:grid;grid-template-columns:52px 52px 52px;gap:5px}
button.control{
 width:52px;height:52px;border:0;border-radius:10px;
 background:#17202bd9;color:white;font-size:20px
}
@media(max-width:650px){
 main{grid-template-columns:1fr;grid-template-rows:42% 58%}
 .panel{padding:16px}
 .preview-label{font-size:10px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="logo">REAL <span>LIFE</span></div>
 <div style="font-size:11px;color:#9ca6b5">ROLEPLAY PROJECT</div>
</header>
<main>
 <div class="preview">
  <div class="preview-label">PERSONAJ KO‘RINISHI</div>
  <div id="scene"></div>
 </div>
 <div class="panel">
  <div class="sub">REAL LIFE • CHARACTER CREATOR</div>
  <h2>Personaj yaratish</h2>
  <div class="sub">O‘z qahramoningizni yarating.</div>

  <div class="section">
   <div class="label">JINSNI TANLANG</div>
   <div class="choices">
    <button class="choice active" id="male">♂ ERKAK</button>
    <button class="choice" id="female">♀ AYOL</button>
   </div>
  </div>

  <div class="section">
   <div class="label">PERSONAJ ISMI</div>
   <input id="name" maxlength="20" placeholder="Ismingizni kiriting">
  </div>

  <div class="section">
   <div class="label">SOCH TURMAGI</div>
   <select id="hair">
    <option value="0">Klassik</option>
    <option value="1">Zamonaviy</option>
    <option value="2">Uzun</option>
   </select>
  </div>

  <div class="section">
   <div class="label">KIYIM RANGI</div>
   <div class="choices">
    <button class="choice active" data-color="#263b59">KO‘K</button>
    <button class="choice" data-color="#252525">QORA</button>
    <button class="choice" data-color="#777777">KULRANG</button>
   </div>
  </div>

  <button class="start" id="start">O‘YINNI BOSHLASH →</button>
  <p style="font-size:11px;color:#828c9b;text-align:center">
   REAL LIFE • YOUR LIFE, YOUR STORY
  </p>
 </div>
</main>
</div>

<div id="game">
 <div id="gameinfo">
  <b>REAL LIFE</b><br>
  <span id="welcome">O‘yinchi</span><br>
  <small>$1000 | Toshkent</small>
 </div>
 <div id="controls">
  <div class="pad">
   <span></span><button class="control" data-k="up">▲</button><span></span>
   <button class="control" data-k="left">◀</button>
   <button class="control" data-k="down">▼</button>
   <button class="control" data-k="right">▶</button>
  </div>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

let gender="male",shirt="#263b59",playerName="";
const sceneEl=document.getElementById("scene");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x283746);
scene.fog=new THREE.Fog(0x283746,10,30);

const camera=new THREE.PerspectiveCamera(40,1,.1,100);
camera.position.set(4,2.5,7);
camera.lookAt(0,1.3,0);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
sceneEl.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x39404c,2));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(4,8,5);
light.castShadow=true;
scene.add(light);

const floor=new THREE.Mesh(
 new THREE.CircleGeometry(3,64),
 new THREE.MeshStandardMaterial({color:0x343d48,roughness:.8})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.05;
floor.receiveShadow=true;
scene.add(floor);

const avatar=new THREE.Group();
scene.add(avatar);

function material(color){return new THREE.MeshStandardMaterial({color,roughness:.7})}
function part(geo,mat,x,y,z){
 const m=new THREE.Mesh(geo,mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 avatar.add(m);
 return m;
}

let clothes,head,hair,legs;

function buildAvatar(){
 avatar.clear();
 const skin=material(0xc68c68);
 clothes=material(shirt);
 const trouser=material(0x202936);

 // Legs
 legs=part(new THREE.BoxGeometry(.31,.85,.34),trouser,-.19,.47,0);
 part(new THREE.BoxGeometry(.31,.85,.34),trouser,.19,.47,0);
 part(new THREE.BoxGeometry(.36,.16,.55),material(0x17191d),-.19,.08,.04);
 part(new THREE.BoxGeometry(.36,.16,.55),material(0x17191d),.19,.08,.04);

 // Torso
 part(new THREE.CapsuleGeometry(.34,.65,6,12),clothes,0,1.38,0);

 // Arms
 part(new THREE.CapsuleGeometry(.105,.65,5,8),clothes,-.43,1.37,0);
 part(new THREE.CapsuleGeometry(.105,.65,5,8),clothes,.43,1.37,0);

 // Head
 head=part(new THREE.SphereGeometry(.24,24,24),skin,0,2.15,0);
 part(new THREE.BoxGeometry(.34,.12,.28),skin,0,1.99,0);

 // Hair
 const hairMat=material(0x201a17);
 if(gender==="male"){
  hair=part(new THREE.SphereGeometry(.245,20,16,0,Math.PI*2,0,Math.PI/2),hairMat,0,2.22,0);
 }else{
  hair=part(new THREE.SphereGeometry(.27,20,16),hairMat,0,2.23,-.045);
 }
}
buildAvatar();

function resize(){
 const w=sceneEl.clientWidth,h=sceneEl.clientHeight;
 if(!w||!h)return;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
new ResizeObserver(resize).observe(sceneEl);
resize();

function animate(){
 requestAnimationFrame(animate);
 avatar.rotation.y=Math.sin(Date.now()*.0004)*.12;
 renderer.render(scene,camera);
}
animate();

document.getElementById("male").onclick=()=>{
 gender="male";
 document.getElementById("male").classList.add("active");
 document.getElementById("female").classList.remove("active");
 buildAvatar();
};
document.getElementById("female").onclick=()=>{
 gender="female";
 document.getElementById("female").classList.add("active");
 document.getElementById("male").classList.remove("active");
 buildAvatar();
};
document.querySelectorAll("[data-color]").forEach(b=>{
 b.onclick=()=>{
  shirt=b.dataset.color;
  document.querySelectorAll("[data-color]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  buildAvatar();
 };
});
document.getElementById("hair").onchange=()=>{
 buildAvatar();
};

document.getElementById("start").onclick=()=>{
 playerName=document.getElementById("name").value.trim();
 if(!playerName){
  alert("Iltimos, personaj ismini kiriting!");
  return;
 }
 document.getElementById("welcome").textContent=playerName;
 document.getElementById("app").style.display="none";
 document.getElementById("game").style.display="block";
 startGame();
};

let gameStarted=false;
function startGame(){
 if(gameStarted)return;
 gameStarted=true;
 const game=document.getElementById("game");
 const world=new THREE.Scene();
 world.background=new THREE.Color(0x83a9c0);
 world.fog=new THREE.Fog(0x83a9c0,35,100);
 const cam=new THREE.PerspectiveCamera(65,1,.1,300);
 cam.position.set(0,5,9);
 const ren=new THREE.WebGLRenderer({antialias:true});
 ren.setPixelRatio(Math.min(devicePixelRatio,1.5));
 game.insertBefore(ren.domElement,game.children[1]);
 const hemi=new THREE.HemisphereLight(0xffffff,0x555566,2);
 world.add(hemi);
 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(20,30,10);
 world.add(sun);

 const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),material(0x657b5a));
 ground.rotation.x=-Math.PI/2;
 world.add(ground);

 function building(x,z,w,d,h,color){
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
  b.position.set(x,h/2,z);
  world.add(b);
 }
 for(let x=-45;x<=45;x+=15){
  for(let z=-45;z<=45;z+=15){
   if(Math.abs(x)<10||Math.abs(z)<10)continue;
   building(x,z,8,8,10+Math.random()*15,0x87949e);
  }
 }
 const road=new THREE.Mesh(new THREE.PlaneGeometry(12,160),material(0x30343b));
 road.rotation.x=-Math.PI/2;
 road.position.y=.02;
 world.add(road);

 const character=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.4,.8,5,10),material(shirt));
 body.position.y=1;
 character.add(body);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.25,16,16),material(0xc68c68));
 h.position.y=1.8;
 character.add(h);
 world.add(character);

 const keys={};
 document.querySelectorAll("[data-k]").forEach(b=>{
  const k=b.dataset.k;
  b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
 });
 window.onkeydown=e=>{
  const map={w:"up",ArrowUp:"up",s:"down",ArrowDown:"down",a:"left",ArrowLeft:"left",d:"right",ArrowRight:"right"};
  if(map[e.key])keys[map[e.key]]=true;
 };
 window.onkeyup=e=>{
  const map={w:"up",ArrowUp:"up",s:"down",ArrowDown:"down",a:"left",ArrowLeft:"left",d:"right",ArrowRight:"right"};
  if(map[e.key])keys[map[e.key]]=false;
 };
 let angle=0;
 function frame(){
  requestAnimationFrame(frame);
  if(keys.left)angle+=.04;
  if(keys.right)angle-=.04;
  if(keys.up){
   character.position.x+=Math.sin(angle)*.11;
   character.position.z-=Math.cos(angle)*.11;
  }
  if(keys.down){
   character.position.x-=Math.sin(angle)*.08;
   character.position.z+=Math.cos(angle)*.08;
  }
  character.rotation.y=angle;
  cam.position.set(character.position.x-Math.sin(angle)*7,4.5,character.position.z+Math.cos(angle)*7);
  cam.lookAt(character.position.x,1,character.position.z);
  ren.render(world,cam);
 }
 function fit(){
  const w=game.clientWidth,h=game.clientHeight;
  cam.aspect=w/h;cam.updateProjectionMatrix();ren.setSize(w,h);
 }
 new ResizeObserver(fit).observe(game);
 fit();
 frame();
}
</script>
</body>
</html>
